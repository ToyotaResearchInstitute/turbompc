[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.10",
    "jaxlib==0.6.2",
    "packaging>=22.0",
]

# Wrapper around scikit_build_core.build to build CMake.
# https://github.com/scikit-build/scikit-build-core
build-backend = "turbompc_build"
backend-path = ["."]

[project]
name = "turbompc"
version = "1.0.0"
description = "TurboMPC: Fast, Scalable, and Differentiable Model Predictive Control on the GPU"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "TurboMPC team", email = "thomas.lew@tri.global"},
]
dependencies = [
    "jax>=0.6.2,<0.7",
    "jaxlib>=0.6.2,<0.7",
    "numpy>=1.17.4",
    "osqp==0.6.7.post3",
    "scipy",
    "pyyaml",
    "pytest",
    "matplotlib",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.6.2,<0.7",
    "nvidia-cusparse-cu12",
    "nvidia-cudss-cu12>=0.8",
]
gpu = ["turbompc[cuda12]"]
rl = ["torch", "diffrax>=0.6.2"]

[project.scripts]
turbompc-check = "turbompc._check_install:main"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"

# Persisting it keeps incremental rebuilds fast across repeated pip installs.
build-dir = "build/skbuild/{wheel_tag}"
wheel.packages = ["turbompc"]

cmake.define.TURBOMPC_POST_BUILD_CHECK = "OFF"
sdist.exclude = [
    "benchmarking",
    "build",
    "docs/figs",
    "examples",
    "tests",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "extended: broad, stress, or diagnosis tests skipped by default",
]
